<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#254e3d"><meta name="description" content="내가 말한 영어가 내 것이 되는 곳. 매일 조금씩 기록하고 복습해요."><title>little by little — 나의 영어 노트</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="#home" data-page="home"><span class="brand-icon">ll<span>✦</span></span><span>little<br>by little<span class="brand-dot">.</span></span></a><nav aria-label="메인 메뉴"><button data-page="home" class="nav active"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10H15v-7H9v7H3Z"/></svg><span class="nav-label">오늘의 영어</span></button><button data-page="notes" class="nav"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M3 7h4M3 12h4M3 17h4M10 8h6M10 12h6M10 16h4"/></svg><span class="nav-label">표현 노트</span><b id="nav-count">0</b></button><button data-page="review" class="nav"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 2M4 16l2 2a7 7 0 0 0 12-1"/></svg><span class="nav-label">복습하기</span><i id="nav-due"></i></button><button data-page="together" class="nav"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 4v2"/></svg><span class="nav-label">함께 공부</span></button></nav><div class="sidebar-bottom"><button class="profile" data-page="settings"><span class="avatar">Y</span><span><strong>예원님의 영어 공간</strong></span><span>⚙</span></button></div></aside>
<div class="app"><header><div><span id="page-label">오늘의 영어</span></div><div class="header-account"><button class="text-btn" data-page="together" id="account-label">로그인 · 초대</button><button class="text-btn" data-page="settings">설정</button><span class="date" id="date"></span></div></header><main id="content"></main></div>
<dialog id="add-dialog"><form id="expression-form"><div class="modal-heading"><div><span class="eyebrow">COLLECT YOUR WORDS</span><h2 id="add-title">기억하고 싶은 표현</h2></div><button type="button" class="icon-btn" id="close-dialog" aria-label="닫기">×</button></div><label>한글 뜻 <small>복습할 때는 이것만 보여요</small><input id="meaning" required maxlength="1000" placeholder="나는 밴을 타고 여기까지 왔어"></label><label>영어 단어 또는 문장 <small>떠올릴 영어 표현</small><textarea id="english" required maxlength="1000" placeholder="I came here by van." rows="3" autocapitalize="off" spellcheck="false"></textarea></label><button class="button primary full" type="submit" id="add-submit">내 표현으로 저장하기 <span>＋</span></button><small class="form-help">저장한 표현은 오늘의 복습에 바로 추가돼요. <button type="button" class="text-btn" data-bulk>여러 개 한 번에 붙여넣기 →</button></small></form></dialog>
<dialog id="bulk-dialog"><form id="bulk-form"><div class="modal-heading"><div><span class="eyebrow">FROM TODAY'S LESSON</span><h2>여러 표현 한 번에 담기</h2></div><button type="button" class="icon-btn" id="close-bulk" aria-label="닫기">×</button></div><label>한 줄에 하나씩 · 영어와 한글 사이에 <b>/</b> 또는 <b>|</b> 또는 탭<textarea id="bulk-text" rows="8" maxlength="20000" autocapitalize="off" spellcheck="false" placeholder="I came here by van. / 나는 밴을 타고 왔어&#10;It's up to you. | 너한테 달렸어&#10;내 말이 그 말이야 / That's what I'm saying."></textarea></label><div id="bulk-preview" class="bulk-preview" aria-live="polite"></div><button class="button primary full" type="submit">모두 오늘의 복습에 추가 <span>＋</span></button><small class="form-help">한글·영어 순서는 상관없어요. 엑셀·노트에서 두 칸을 복사해 붙여넣어도 돼요.</small></form></dialog>
<div id="toast" role="status"></div><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
