<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#254e3d"><meta name="description" content="내가 말한 영어가 내 것이 되는 곳. 매일 조금씩 기록하고 복습해요."><title>little by little — 나의 영어 노트</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="sidebar"><a class="brand" href="#home"><span class="brand-icon">ll<span>✦</span></span><span>little<br>by little<span class="brand-dot">.</span></span></a><div class="workspace-label">MY ENGLISH SPACE</div><nav aria-label="메인 메뉴"><button data-page="home" class="nav active"><span>⌂</span>오늘의 영어</button><button data-page="lesson" class="nav"><span>✎</span>헤이링 복습</button><button data-page="talk" class="nav"><span>◌</span>말하기 연습</button><button data-page="notes" class="nav"><span>▤</span>나의 표현 노트 <b id="nav-count">0</b></button><button data-page="review" class="nav"><span>↻</span>오늘의 복습 <i id="nav-due"></i></button><button data-page="together" class="nav"><span>♡</span>함께 공부</button><button data-page="settings" class="nav"><span>⚙</span>학습 설정</button></nav><div class="sidebar-bottom"><div class="little-note"><span>✳</span><p>A little every day,<br>a lot along the way.</p><small>조금씩, 나만의 속도로.</small></div><button class="profile" data-page="settings"><span class="avatar">Y</span><span><strong>예원님의 영어 공간</strong><small>오늘도 한 문장 더</small></span><span>⚙</span></button></div></aside>
<div class="app"><header><div><span class="breadcrumb">MY DAILY ENGLISH</span><span class="header-divider">/</span><span id="page-label">오늘의 영어</span></div><div class="header-account"><button class="text-btn" data-page="together" id="account-label">로그인 · 초대</button><span class="date" id="date"></span></div></header><main id="content"></main><footer>Made of your words. <span>나의 일상이, 나의 영어가 되는 곳.</span><span class="footer-flower">✳</span></footer></div>
<dialog id="add-dialog"><form id="expression-form"><div class="modal-heading"><div><span class="eyebrow">COLLECT YOUR WORDS</span><h2>기억하고 싶은 표현</h2></div><button type="button" class="icon-btn" id="close-dialog" aria-label="닫기">×</button></div><label>영어 단어 또는 문장<textarea id="english" required maxlength="1000" placeholder="I came here by van." rows="3"></textarea></label><label>뜻 또는 나만의 메모<input id="meaning" maxlength="1000" placeholder="나는 밴을 타고 여기까지 왔어"></label><label>어떤 이야기였나요?<select id="category"><option>일상</option><option>여행</option><option>작업과 취미</option><option>자유 대화</option></select></label><button class="button primary full" type="submit">내 표현으로 저장하기 <span>＋</span></button><small class="form-help">저장한 표현은 오늘의 복습에 바로 추가돼요.</small></form></dialog>
<div id="toast" role="status"></div><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
