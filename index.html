<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0d0e0f"><meta name="description" content="내가 말한 영어가 내 것이 되는 곳. 매일 조금씩 기록하고 복습해요."><title>little by little — 나의 영어 노트</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="shell"><header class="topbar"><h1 id="page-label">오늘의 영어</h1><div class="top-actions"><span class="streak-pill" title="연속 복습">🔥 <b id="streak-count">0</b></span><button class="avatar-btn" data-page="settings" aria-label="설정"><span id="avatar">나</span></button></div></header><main id="content"></main></div>
<nav class="tabbar" aria-label="메인 메뉴"><button data-page="home" class="nav active"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>홈</span></button><button data-page="notes" class="nav"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 5h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg><span>노트</span><b id="nav-count" hidden>0</b></button><button data-page="review" class="nav"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg><span>복습</span><i id="nav-due"></i></button><button data-page="together" class="nav"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg><span>친구</span></button></nav>
<dialog id="add-dialog"><form id="expression-form"><div class="modal-heading"><div><span class="eyebrow">COLLECT YOUR WORDS</span><h2 id="add-title">기억하고 싶은 표현</h2></div><button type="button" class="icon-btn" id="close-dialog" aria-label="닫기">×</button></div><label>한글 뜻 <small>복습할 때는 이것만 보여요</small><input id="meaning" required maxlength="1000" placeholder="나는 밴을 타고 여기까지 왔어"></label><label>영어 단어 또는 문장 <small>떠올릴 영어 표현</small><textarea id="english" required maxlength="1000" placeholder="I came here by van." rows="3" autocapitalize="off" spellcheck="false"></textarea></label><button class="button primary full" type="submit" id="add-submit">내 표현으로 저장하기 <span>＋</span></button><small class="form-help">저장한 표현은 오늘의 복습에 바로 추가돼요. <button type="button" class="text-btn" data-bulk>여러 개 한 번에 붙여넣기 →</button></small></form></dialog>
<dialog id="bulk-dialog"><form id="bulk-form"><div class="modal-heading"><div><span class="eyebrow">FROM TODAY'S LESSON</span><h2>여러 표현 한 번에 담기</h2></div><button type="button" class="icon-btn" id="close-bulk" aria-label="닫기">×</button></div><label>한 줄에 하나씩 · 영어와 한글 사이에 <b>/</b> 또는 <b>|</b> 또는 탭<textarea id="bulk-text" rows="8" maxlength="20000" autocapitalize="off" spellcheck="false" placeholder="I came here by van. / 나는 밴을 타고 왔어&#10;It's up to you. | 너한테 달렸어&#10;내 말이 그 말이야 / That's what I'm saying."></textarea></label><div id="bulk-preview" class="bulk-preview" aria-live="polite"></div><button class="button primary full" type="submit">모두 오늘의 복습에 추가 <span>＋</span></button><small class="form-help">한글·영어 순서는 상관없어요. 엑셀·노트에서 두 칸을 복사해 붙여넣어도 돼요.</small></form></dialog>
<div id="toast" role="status"></div><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
